[training]
exten => 900,1,ExecIf($[${STAT(e,/provision/maintenance)}]?Hangup())
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
exten => _10[1-4],1,ExecIf($[${STAT(e,/provision/maintenance)}]?Hangup())
 same => n,Set(SERVICE_NUMBER=${EXTEN})
 same => n,Goto(training-service,s,1)
; DDS destinations are temporary, bound to the authenticated student account.
exten => _8X.,1,ExecIf($[${STAT(e,/provision/maintenance)}]?Hangup())
 same => n,Set(DDS_ROUTE=${DB(dds/${ARM_USER_ID}/${EXTEN})})
 same => n,GotoIf($["${DDS_ROUTE}" = ""]?deny)
 same => n,Set(ARM_SOUND=${CUT(DDS_ROUTE,:,1)})
 same => n,Set(ARM_RUN_ID=${CUT(DDS_ROUTE,:,2)})
 same => n,Set(ARM_CALL_ID=${CUT(DDS_ROUTE,:,3)})
 same => n,Set(DDS_DELETE=${DB_DELETE(dds/${ARM_USER_ID}/${EXTEN})})
 same => n,Answer()
 same => n,MixMonitor(/media/recording-${ARM_RUN_ID}-${ARM_CALL_ID}.wav)
 same => n,UserEvent(DDSAnswered,CallID:${ARM_CALL_ID},RunID:${ARM_RUN_ID},UserID:${ARM_USER_ID},Channel:${CHANNEL})
 same => n,Wait(1)
 same => n,Playback(/media/${ARM_SOUND})
 same => n,Wait(300)
 same => n(deny),Hangup()
exten => _99X.,1,ExecIf($[${STAT(e,/provision/maintenance)}]?Hangup())
 same => n,GotoIf($["${EXTEN}" != "99${ARM_USER_ID}"]?deny)
 same => n,Answer()
 same => n,ConfBridge(arm112-${ARM_USER_ID},training_bridge,training_user)
 same => n(deny),Hangup()
[training-playback]
exten => s,1,ExecIf($[${STAT(e,/provision/maintenance)}]?Hangup())
 same => n,Answer()
 same => n,Set(CHANNEL(language)=ru)
 same => n,MixMonitor(/media/recording-${ARM_RUN_ID}-${ARM_CALL_ID}.wav)
 same => n,Wait(1)
 same => n,Playback(/media/${ARM_SOUND})
 same => n,Wait(180)
 same => n,Hangup()

[training-service]
exten => s,1,ExecIf($[${STAT(e,/provision/maintenance)}]?Hangup())
 same => n,GotoIf($[${STAT(e,/provision/dispatch-${ARM_USER_ID}-${SERVICE_NUMBER}.allow)}]?service-authorized:service-denied)
 same => n(service-denied),Busy(3)
 same => n,Hangup()
 same => n(service-authorized),Set(RING_COUNT=${RAND(1,3)})
 same => n,Ringing()
 same => n,Wait($[${RING_COUNT} * 2])
 same => n,Answer()
 same => n,Set(SERVICE_SOUND=${DB(arm112/service${SERVICE_NUMBER})})
 same => n,GotoIf($["${SERVICE_NUMBER}" = "101"]?service-random)
 same => n,GotoIf($["${SERVICE_NUMBER}" = "102"]?service-random)
 same => n,GotoIf($["${SERVICE_NUMBER}" = "103"]?service-random)
 same => n,GotoIf($["${SERVICE_NUMBER}" = "104"]?service-random)
 same => n,GotoIf($["${SERVICE_SOUND}" = ""]?default)
 same => n,Wait(1)
 same => n,Playback(/media/${SERVICE_SOUND})
 same => n,Wait(2)
 same => n,Hangup()
 same => n(default),Wait(1)
 same => n,Playback(/media/service-${SERVICE_NUMBER})
 same => n,Wait(2)
 same => n,Hangup()
 same => n(service-random),Set(SERVICE_SET=${RAND(1,10)})
 same => n,Wait(1)
 same => n,Playback(/media/service-${SERVICE_NUMBER}-${SERVICE_SET}-start)
 same => n,WaitExten(180)
 same => n,Hangup()

exten => #,1,GotoIf($["${SERVICE_NUMBER}" =~ "^(101|102|103|104)$"]?training-service,s,service-random-end)
 same => n,Hangup()
 same => n(service-random-end),Playback(/media/service-${SERVICE_NUMBER}-${SERVICE_SET}-end)
 same => n,Wait(2)
 same => n,Hangup()
